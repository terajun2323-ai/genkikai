<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>セミナー受付</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body { font-family: sans-serif; text-align: center; padding: 40px 20px; }
    .big { font-size: 28px; font-weight: bold; margin: 20px 0; }
    button, a.btn { display: inline-block; padding: 14px 28px; font-size: 18px;
      background: #06c755; color: #fff; border: 0; border-radius: 8px; text-decoration: none; }
    button.sub { background: #888; }
    .row { display: flex; gap: 12px; justify-content: center; margin-top: 16px; }
    input { font-size: 18px; padding: 10px; width: 80%; margin-bottom: 12px; }
  </style>
</head>
<body>
  <div id="app">読み込み中...</div>

<script>
const LIFF_ID = '2011979409-6dsnPyBw';
const GAS_URL = 'https://script.google.com/macros/s/AKfycbxX8MLW87u3p4v-OYdGwmFYMM4_Lq2cLqFk7Jjgo8iAq6KAmaVV1cDikIAAB6UxNn3isQ/exec';
const OA_ADD_URL = 'https://line.me/R/ti/p/@153ouqvo';
const OA_CHAT_URL = 'https://line.me/R/oaMessage/@153ouqvo/?' + encodeURIComponent('セミナー受付で参加者名簿に見つかりませんでした');
const FORM_URL = ''; // 申込みフォームのURL(無ければ空のまま)

const app = document.getElementById('app');
let isFriend = false;

async function main() {
  await liff.init({ liffId: LIFF_ID });
  if (!liff.isLoggedIn()) { liff.login(); return; }

  const f = await liff.getFriendship();
  isFriend = f.friendFlag === true;
  await checkin();
}

async function checkin(phone, name, minor) {
  app.textContent = '受付中...';
  const res = await fetch(GAS_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain' },
    body: JSON.stringify({
      idToken: liff.getIDToken(),
      phone: phone,
      name: name,
      minor: minor,
      isFriend: isFriend
    }),
  });
  const r = await res.json();

  const minorMsg = r.minor
    ? '<p style="background:#fff3cd;border:1px solid #e0c060;border-radius:8px;padding:12px;font-weight:bold;">未成年の方は、受付スタッフにお声がけください</p>'
    : '';

  if (r.status === 'ok') {
    app.innerHTML = '<div class="big">✅ 受付OK</div><p>' + esc(r.name) + ' 様</p>' + minorMsg;
  } else if (r.status === 'already') {
    app.innerHTML = '<div class="big">✅ 受付済みです</div><p>' + esc(r.name) + ' 様</p>' + minorMsg;
  } else if (r.status === 'need_minor') {
    showMinorForm(r.name);
  } else if (r.status === 'need_friend') {
    app.innerHTML =
      '<div class="big">あと一歩です</div>' +
      '<p>' + esc(r.name) + ' 様、ご本人確認ができました。</p>' +
      '<p>受付を完了するには、<b>公式LINEの友だち追加</b>が必要です。<br>' +
      '追加したあと、もう一度QRコードを読み込んでください。</p>' +
      '<a class="btn" href="' + OA_ADD_URL + '">公式LINEを友だち追加する</a>';
  } else if (r.status === 'need_phone' || r.status === 'not_found') {
    showPhoneForm(r.status === 'not_found' ? 'notfound' : '', phone);
  } else if (r.status === 'need_name') {
    showNameForm(phone);
  } else {
    app.innerHTML = '<div class="big">エラー</div><p>スタッフにお声がけください</p>' +
      '<p style="font-size:14px;color:#888">' + esc(r.message || r.status) + '</p>';
  }
}

function showMinorForm(userName) {
  app.innerHTML =
    '<div class="big">年齢の確認</div>' +
    '<p>' + esc(userName) + ' 様</p>' +
    '<p style="font-size:20px;font-weight:bold;">あなたは未成年(20歳未満)ですか？</p>' +
    '<div class="row">' +
    '<button id="minorYes">はい</button>' +
    '<button id="minorNo" class="sub">いいえ</button>' +
    '</div>';
  document.getElementById('minorYes').onclick = function () { checkin(undefined, undefined, 'yes'); };
  document.getElementById('minorNo').onclick = function () { checkin(undefined, undefined, 'no'); };
}

function showPhoneForm(msg, prev) {
  let notFound = '';
  if (msg) {
    notFound =
      '<div style="background:#fff3f3;border:1px solid #f5c2c2;border-radius:8px;padding:14px;margin:12px 0;">' +
      '<p style="color:#c00;font-weight:bold;margin:0 0 8px;">参加者名簿に見つかりませんでした</p>' +
      '<p style="margin:0 0 12px;font-size:14px;">電話番号の下4桁をご確認のうえ、もう一度入力してください。<br>' +
      'お申込みがお済みでない場合は、下のボタンからご連絡ください。</p>' +
      '<a class="btn" style="font-size:15px;padding:10px 20px;" href="' + OA_CHAT_URL + '">公式LINEで連絡する</a>' +
      (FORM_URL ? '<p style="margin:12px 0 0;"><a href="' + FORM_URL + '">申込みフォームはこちら</a></p>' : '') +
      '</div>';
  }

  app.innerHTML =
    '<div class="big">本人確認</div>' +
    '<p>お申込み時の<b>電話番号の下4桁</b>を入力してください</p>' +
    notFound +
    '<input id="phone" inputmode="numeric" maxlength="4" placeholder="例: 7139" value="' + esc(prev || '') + '"><br>' +
    '<button id="goPhone">受付する</button>';
  document.getElementById('goPhone').onclick = function () {
    checkin(document.getElementById('phone').value.trim());
  };
}

function showNameForm(phone) {
  app.innerHTML =
    '<div class="big">お名前の入力</div>' +
    '<p>同じ下4桁の方がいるため、<b>お申込み時のお名前</b>も入力してください</p>' +
    '<input id="nm" placeholder="例: 山田 太郎"><br>' +
    '<button id="goName">受付する</button>';
  document.getElementById('goName').onclick = function () {
    checkin(phone, document.getElementById('nm').value.trim());
  };
}

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

main().catch(function (e) { app.textContent = 'エラー: ' + e.message; });
</script>
</body>
</html>
